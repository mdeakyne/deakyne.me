[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deakyne-chat-backend"
version = "0.1.0"
description = "FastAPI chat backend MVP for deakyne.me/.dev"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "starlette>=0.37",
  # Optional at runtime; imported defensively
  "posthog>=3.5; python_version >= '3.8'",
  "oso>=0.27; python_version >= '3.8'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

