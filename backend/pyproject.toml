[project]
name = "deakyne-me-backend"
version = "0.1.0"
description = "Backend API for Deakyne.me developer portal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "posthog>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
